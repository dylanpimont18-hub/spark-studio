<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Spark Pro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B2D48">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Spark Pro, retour à l’accueil">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 1.5 13.9 10.1 22.5 12 13.9 13.9 12 22.5 10.1 13.9 1.5 12 10.1 10.1Z"/>
        </svg>
        <span class="brand-name">Spark Pro</span>
      </a>
      <a class="btn btn-small" href="/#contact">Demander un devis</a>
    </div>
  </header>

  <main>
    <section class="hero is-dark" aria-labelledby="nf-title">
      <div class="wrap hero-inner">
        <p class="nf-code" aria-hidden="true">404</p>
        <h1 class="hero-title" id="nf-title">Cette page<br><span class="line-light">n’existe pas.</span></h1>

        <div class="hero-rule" aria-hidden="true">
          <span class="hero-rule-bar"></span>
          <svg class="spark" viewBox="0 0 24 24" focusable="false">
            <path d="M12 1.5 13.9 10.1 22.5 12 13.9 13.9 12 22.5 10.1 13.9 1.5 12 10.1 10.1Z"/>
          </svg>
        </div>

        <div class="hero-aside">
          <p class="lede">Le lien est peut-être ancien ou mal recopié. Tout le reste est sur la page d’accueil.</p>
          <div class="cta-group">
            <a class="btn" href="/">Retour à l’accueil</a>
            <p class="cta-note">Ou écrivez à <a href="mailto:contact@sparklearning.fr">contact@sparklearning.fr</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
